name: Security Tests

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-tests:
    name: security-tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-key-nao-usar-em-producao-0123456789abcdef
      DATABASE_URL: postgresql://user:pass@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m pytest tests/ -v