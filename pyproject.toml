[project]
name = "ecomshield"
version = "0.1.0"
description = "Secure e-commerce refund and risk management platform"
requires-python = ">=3.10"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart",
    "sqlalchemy",
    "pandas",
    "certifi",
    "numpy",
    "matplotlib",
    "seaborn",
    "jupyter",
    "pyarrow",
    "scikit-learn",
    "joblib",
    "openai-agents>=0.19.4,<0.20",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff"
]
