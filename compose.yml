services:
  db:
    image: postgres:16-alpine
    container_name: ecomshield-db
    environment:
      POSTGRES_USER: ecomshield
      POSTGRES_PASSWORD: ecomshield_dev
      POSTGRES_DB: ecomshield
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecomshield"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: ecomshield-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./data:/app/data

volumes:
  pgdata:
